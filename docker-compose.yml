version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zumbii-postgres
    environment:
      POSTGRES_USER: zumbii
      POSTGRES_PASSWORD: zumbii_secret
      POSTGRES_DB: zumbii
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zumbii-network

  mongodb:
    image: mongo:7
    container_name: zumbii-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: zumbii
      MONGO_INITDB_ROOT_PASSWORD: zumbii_secret
      MONGO_INITDB_DATABASE: zumbii_analytics
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - zumbii-network

  redis:
    image: redis:7-alpine
    container_name: zumbii-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - zumbii-network

  elasticsearch:
    image: elasticsearch:8.14.0
    container_name: zumbii-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - zumbii-network

  kibana:
    image: kibana:8.14.0
    container_name: zumbii-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - zumbii-network

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  elasticsearch_data:

networks:
  zumbii-network:
    driver: bridge
